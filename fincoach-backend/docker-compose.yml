# Local development stack for the FinCoach backend on Docker Desktop.
#
#   docker compose up --build      # build + run (first build is slow: torch + OCR)
#   docker compose up              # run again (cached)
#   docker compose down            # stop
#
# Reads secrets from ./.env (Supabase, LLM, TAVILY_API_KEY, ...). That file is
# git-ignored and is NOT baked into the image.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: fincoach-backend:dev
    container_name: fincoach-backend
    env_file:
      - .env
    environment:
      ADMIN_STATIC_DIR: /app/admin-static
      # Local Docker Desktop primary; deployment-specific override of .env.
      LLM_PRIMARY_MODEL: "gemini-3.5-flash-lite"
      LLM_PRIMARY_MAX_TOKENS: "4096"
      COACH_RESEARCH_POLICY_ENABLED: "true"
      # LLM-first read interpretation (merged from the 2026-10-17 candidate).
      COACH_LLM_INTERPRETATION_ENABLED: "true"
      COACH_REQUEST_DEADLINE_SECONDS: "120"
      # One structured call shares 15 seconds across providers: Gemini can use
      # up to 12 seconds, with 3 seconds reserved for DeepSeek if it times out.
      COACH_STRUCTURED_TIMEOUT_SECONDS: "15"
      # The primary window is measured from request start, including research.
      # Primary eligibility ends at second 110, leaving 10 seconds for fallback.
      LLM_PRIMARY_TIMEOUT_SECONDS: "110"
      LLM_FALLBACK_TIMEOUT_SECONDS: "18"
      COACH_RESEARCH_ANSWER_RESERVE_SECONDS: "30"
      GROUNDING_VERIFIER_TIMEOUT_SECONDS: "5"
    ports:
      - "8000:8000"
    volumes:
      # Keep the host mounts so local source and corpus changes are available
      # after a container restart. Uvicorn reload is intentionally disabled by
      # default because its file watcher is unreliable on Windows bind mounts.
      - ./app:/app/app
      - ./corpus:/app/corpus
      # npm run build in fincoach-admin syncs its bundle here. Keep the served
      # files read-only; refresh/restart after building a new website version.
      - ./admin-static:/app/admin-static:ro
      # Persist downloaded models (BGE-M3 embeddings ~2 GB, PaddleOCR) across
      # restarts so they are fetched once, not on every boot.
      - fincoach-model-cache:/root/.cache
      - fincoach-ocr-cache:/root/.paddlex
      # Only hash-validated public guidance is persisted by PublicSourceStore.
      - fincoach-public-source-cache:/app/data/public-source-cache
    # Use a stable process for Docker Desktop on Windows. Restart the service
    # after Python source changes instead of relying on --reload.
    command: >
      python -m uvicorn app.main:app
      --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5m

volumes:
  fincoach-model-cache:
  fincoach-ocr-cache:
  fincoach-public-source-cache:
