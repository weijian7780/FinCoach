# Explicit opt-in deployment of the reviewed candidate to Windows Docker Desktop.
# Use with docker-compose.yml and --context desktop-linux.
services:
  backend:
    image: fincoach-backend:interpretation-20261017
    build:
      context: ../.deploy-stage/llm-interpretation-20261017
      dockerfile: Dockerfile.desktop-candidate
    environment:
      COACH_LLM_INTERPRETATION_ENABLED: "true"
    healthcheck:
      interval: 120s
    volumes:
      # Replace the same container destination; keep canonical source untouched.
      - ../.deploy-stage/receipt-default-rm-20261018/app:/app/app:ro
